name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install ffmpeg (the pipeline test encodes for real)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        # yt-dlp and itg-charter are replaced by fake scripts: no network, no GPU.
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: itg-yt-linux-x86_64
          path: |
            target/release/itg-yt
            README.md
            LICENSE
          if-no-files-found: error

  # Pushing a tag like v0.2.0 publishes a GitHub release with the Linux binary,
  # once the checks have passed.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        run: |
          cargo build --release
          name="itg-yt-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/itg-yt README.md LICENSE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            itg-yt-*.tar.gz
            itg-yt-*.tar.gz.sha256
          generate_release_notes: true
