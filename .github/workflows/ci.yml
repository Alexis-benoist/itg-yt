name: CI

on:
  push:
    # Docs do not change the binary: no build, no release.
    paths-ignore: ["**.md", "LICENSE"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE"]
  # Weekly: the newcomer job downloads the latest yt-dlp / deno / ffmpeg, so a renamed
  # upstream asset is caught even without pushes. Releases only run on push (see `version`).
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

# A newer push to the same branch cancels the run in progress, except on main and tags,
# where every run publishes a release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install ffmpeg (the pipeline tests encode for real)
        # `apt-get update` is most of the time here: only when the image's lists are stale.
        run: |
          sudo apt-get install -y --no-install-recommends ffmpeg \
            || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Tests
        # yt-dlp is replaced by a fake script (no network); charts are generated by the
        # itg-charter library without Demucs (no GPU).
        run: cargo test --locked --release
      - name: Upload the Linux binary
        uses: actions/upload-artifact@v4
        with:
          name: itg-yt-linux-x86_64
          path: |
            target/release/itg-yt
            README.md
            LICENSE
          if-no-files-found: error

  # A newcomer on each OS: nothing installed, then `itg-yt setup` (real downloads of the
  # tools), the link into a fake ITGmania Songs folder, and a full run with the downloaded
  # ffmpeg and a fake yt-dlp (Unix). See ci/newbie.sh and ci/newbie.ps1.
  # Runs in parallel with `check` (it builds its own binary).
  newbie:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: newbie
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --release
      - name: Newcomer scenarios (Unix)
        if: runner.os != 'Windows'
        run: ci/newbie.sh target/release/itg-yt
      - name: Newcomer scenarios (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./ci/newbie.ps1 target/release/itg-yt.exe
      # Runner IPs are often blocked by YouTube: informative only, never required.
      - name: Real YouTube download (weekly, allowed to fail, Unix)
        if: github.event_name == 'schedule' && runner.os != 'Windows'
        continue-on-error: true
        run: ci/newbie.sh target/release/itg-yt youtube
      - name: Real YouTube download (weekly, allowed to fail, Windows)
        if: github.event_name == 'schedule' && runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: ./ci/newbie.ps1 target/release/itg-yt.exe youtube

  # Every push to main (and every v* tag) publishes a GitHub release with binaries for
  # all platforms, once the checks have passed (the binaries are built in parallel with
  # them; only `release` waits for `check`). Pushes to main get the version
  # vMAJOR.MINOR.<run number> (MAJOR.MINOR from Cargo.toml).
  version:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            tag="$GITHUB_REF_NAME"
          else
            majmin=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([0-9]+)\.([0-9]+)\..*/\1.\2/')
            tag="v${majmin}.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "release $tag"

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive_suffix: linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_suffix: macos-arm64
          # macos-13 (Intel) runners are retired: cross-compile from Apple silicon.
          - os: macos-latest
            target: x86_64-apple-darwin
            archive_suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_suffix: windows-x86_64
    runs-on: ${{ matrix.os }}
    env:
      NAME: itg-yt-${{ needs.version.outputs.tag }}-${{ matrix.archive_suffix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir "$NAME"
          cp "target/${{ matrix.target }}/release/itg-yt" README.md LICENSE "$NAME/"
          tar czf "$NAME.tar.gz" "$NAME"
          shasum -a 256 "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path $env:NAME
          Copy-Item "target\${{ matrix.target }}\release\itg-yt.exe", "README.md", "LICENSE" -Destination $env:NAME
          Compress-Archive -Path $env:NAME -DestinationPath "$env:NAME.zip"
          (Get-FileHash "$env:NAME.zip" -Algorithm SHA256).Hash.ToLower() + "  $env:NAME.zip" | Out-File -Encoding ascii "$env:NAME.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.archive_suffix }}
          path: ${{ env.NAME }}.*
          if-no-files-found: error

  # One job creates the release, with the binaries of every platform that built.
  release:
    needs: [check, version, build]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.version.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - run: ls -la dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: itg-yt ${{ needs.version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
          make_latest: true
